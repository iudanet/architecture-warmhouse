openapi: 3.0.3
info:
  title: Device Service API
  description: |
    REST API микросервиса управления устройствами (Device Service) экосистемы «Тёплый дом».
    Используется для синхронного взаимодействия: получение метаданных устройств,
    обновление их состояния и отправка команд.
  version: 1.0.0

servers:
  - url: https://api.warmhouse.example.com/v1
    description: Production
  - url: http://localhost:8080/v1
    description: Local (через API Gateway)

tags:
  - name: devices
    description: Управление устройствами

# JWT валидируется на API Gateway; user_id приходит из claim sub (см. README, Задание 2).
security:
  - bearerAuth: []

paths:
  /devices:
    get:
      tags: [devices]
      summary: Получить список устройств
      description: Возвращает список устройств с фильтрацией по дому.
      operationId: listDevices
      parameters:
        - name: house_id
          in: query
          description: Идентификатор дома для фильтрации
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Список устройств
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
              example:
                - id: "8f1c9a40-2b3d-4e5f-9a1b-2c3d4e5f6a7b"
                  type_id: "1a2b3c4d-0000-0000-0000-000000000001"
                  house_id: "11111111-1111-1111-1111-111111111111"
                  serial_number: "SN-HEAT-0001"
                  name: "Котёл — гостиная"
                  status: "on"
                  created_at: "2026-06-01T10:00:00Z"
                  updated_at: "2026-06-05T12:30:00Z"
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [devices]
      summary: Зарегистрировать устройство
      description: Создаёт (подключает) новое устройство в доме пользователя.
      operationId: createDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeviceRequest'
            example:
              type_id: "1a2b3c4d-0000-0000-0000-000000000001"
              house_id: "11111111-1111-1111-1111-111111111111"
              serial_number: "SN-HEAT-0001"
              name: "Котёл — гостиная"
      responses:
        '201':
          description: Устройство создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /devices/{deviceId}:
    parameters:
      - name: deviceId
        in: path
        required: true
        description: Идентификатор устройства
        schema:
          type: string
          format: uuid
    get:
      tags: [devices]
      summary: Получить информацию об устройстве
      operationId: getDevice
      responses:
        '200':
          description: Данные устройства
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              example:
                id: "8f1c9a40-2b3d-4e5f-9a1b-2c3d4e5f6a7b"
                type_id: "1a2b3c4d-0000-0000-0000-000000000001"
                house_id: "11111111-1111-1111-1111-111111111111"
                serial_number: "SN-HEAT-0001"
                name: "Котёл — гостиная"
                status: "on"
                created_at: "2026-06-01T10:00:00Z"
                updated_at: "2026-06-05T12:30:00Z"
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /devices/{deviceId}/state:
    parameters:
      - name: deviceId
        in: path
        required: true
        description: Идентификатор устройства
        schema:
          type: string
          format: uuid
    patch:
      tags: [devices]
      summary: Обновить состояние устройства
      description: Обновляет текущее состояние устройства (например, on/off).
      operationId: updateDeviceState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStateRequest'
            example:
              status: "off"
      responses:
        '200':
          description: Состояние обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /devices/{deviceId}/commands:
    parameters:
      - name: deviceId
        in: path
        required: true
        description: Идентификатор устройства
        schema:
          type: string
          format: uuid
    post:
      tags: [devices]
      summary: Отправить команду устройству
      description: |
        Отправляет команду на физическое устройство через Device Connector.
        Используется в том числе Automation Service при срабатывании правил.
      operationId: sendDeviceCommand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
            example:
              action: "turn_on"
              params:
                target_temperature: 22
      responses:
        '202':
          description: Команда принята к исполнению
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
              example:
                command_id: "c0ffee00-1234-5678-9abc-def012345678"
                status: "accepted"
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT, выданный User Service; проверяется на API Gateway.

  schemas:
    Device:
      type: object
      required: [id, type_id, house_id, serial_number, name, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        type_id:
          type: string
          format: uuid
        house_id:
          type: string
          format: uuid
        serial_number:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [on, off, offline]
          description: Текущее состояние устройства
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateDeviceRequest:
      type: object
      required: [type_id, house_id, serial_number, name]
      properties:
        type_id:
          type: string
          format: uuid
        house_id:
          type: string
          format: uuid
        serial_number:
          type: string
        name:
          type: string

    UpdateStateRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [on, off]

    CommandRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          description: Действие (turn_on, turn_off, set_temperature, ...)
        params:
          type: object
          additionalProperties: true
          description: Произвольные параметры команды

    CommandAccepted:
      type: object
      required: [command_id, status]
      properties:
        command_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [accepted]

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

  responses:
    BadRequest:
      description: Некорректные входные данные
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: "bad_request"
            message: "Поле serial_number обязательно"
    NotFound:
      description: Устройство не найдено
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: "not_found"
            message: "Устройство с указанным id не найдено"
    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: "internal_error"
            message: "Внутренняя ошибка сервера"
